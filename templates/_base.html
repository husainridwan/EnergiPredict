<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Day-ahead HVAC energy forecasting for large auditoria.">
  <title>{% block title %}EnergiPredict{% endblock %}</title>
  <style>
    :root {
      --night: #112631;
      --night-soft: #1a3642;
      --paper: #f3f5f1;
      --ink: #17303c;
      --muted: #58707a;
      --line: #cad7d7;
      --signal: #d86a37;
      --signal-dark: #a94420;
      --sun: #e4b544;
      --white: #ffffff;
      --shadow: 0 16px 38px rgb(17 38 49 / 10%);
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-width: 320px; }
    a { color: inherit; text-underline-offset: 0.18em; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

    .site-header {
      background: var(--night);
      border-bottom: 5px solid var(--signal);
      color: var(--paper);
    }
    .header-inner, .page-shell, .site-footer__inner {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
    }
    .header-inner { padding: 1.25rem 0 1.05rem; }
    .brand-line { display: flex; align-items: baseline; gap: 0.75rem; justify-content: space-between; }
    .brand {
      color: var(--white);
      font-family: "Arial Narrow", Impact, sans-serif;
      font-size: clamp(1.65rem, 3.6vw, 2.5rem);
      font-stretch: condensed;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .status-stamp {
      border: 1px solid rgb(243 245 241 / 45%);
      color: var(--sun);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.45rem;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .site-nav { display: flex; flex-wrap: wrap; gap: 0.25rem 1.1rem; margin-top: 1rem; }
    .site-nav a { color: rgb(243 245 241 / 82%); font-size: 0.9rem; font-weight: 700; text-decoration: none; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--sun); }

    main { padding: clamp(2rem, 5vw, 4.5rem) 0; }
    .page-shell { max-width: 940px; }
    h1, h2, h3 { color: var(--night); line-height: 1.08; }
    h1 {
      border-bottom: 1px solid var(--line);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 6vw, 4.3rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      margin: 0 0 1.6rem;
      padding-bottom: 1rem;
    }
    h2 { font-size: clamp(1.25rem, 2.8vw, 1.75rem); margin: 2.5rem 0 0.75rem; }
    p, li { line-height: 1.65; }
    code { background: #e0e7e3; border-radius: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; padding: 0.1em 0.3em; }
    .muted { color: var(--muted); }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-left: 5px solid var(--signal);
      box-shadow: var(--shadow);
      margin: 1.4rem 0;
      padding: clamp(1rem, 3vw, 1.75rem);
    }
    .card > :first-child { margin-top: 0; }
    .card > :last-child { margin-bottom: 0; }
    .badge { background: var(--night); color: var(--paper); display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.75rem; letter-spacing: 0.04em; padding: 0.35rem 0.55rem; text-transform: uppercase; }
    button, .button {
      background: var(--signal);
      border: 0;
      color: var(--white);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      padding: 0.7rem 1rem;
      text-decoration: none;
    }
    button:hover, .button:hover { background: var(--signal-dark); }
    button:disabled { cursor: wait; opacity: 0.65; }
    input[type="file"] { max-width: 100%; padding: 0.65rem; }
    table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; white-space: nowrap; }
    th, td { border-bottom: 1px solid var(--line); padding: 0.7rem 0.85rem; text-align: left; }
    th { background: #e7eeea; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    pre { max-width: 100%; overflow-x: auto; }

    .site-footer { background: var(--night-soft); color: rgb(243 245 241 / 78%); }
    .site-footer__inner { display: flex; flex-wrap: wrap; gap: 0.6rem 1.5rem; justify-content: space-between; padding: 1.2rem 0; }
    .site-footer p { font-size: 0.83rem; margin: 0; }
    .site-footer a { color: var(--sun); }

    @media (max-width: 540px) {
      .brand-line { align-items: flex-start; flex-direction: column; gap: 0.55rem; }
      .site-nav { gap: 0.6rem 1rem; }
      th, td { padding: 0.55rem 0.65rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-line">
        <a class="brand" href="/">EnergiPredict</a>
        <span class="status-stamp">Forecast desk · v{{ version }}</span>
      </div>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/">Overview</a>
        <a href="/predict">Forecast</a>
        <a href="/benchmarks">Benchmarks</a>
        <a href="/method">Method</a>
        <a href="/api/results">API results</a>
        <a href="/docs">API docs</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="page-shell">
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>HVAC energy forecasting for large auditoria.</p>
      <p><a href="/health">Service health</a> · {{ target_units }}</p>
    </div>
  </footer>
</body>
</html>
